spring.application.name=financial-book-management-api
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bookmanagement}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.default-property-inclusion=non_null
spring.mvc.problemdetails.enabled=false
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
spring.main.banner-mode=off
spring.jpa.show-sql=true
logging.level.org.springframework.security=DEBUG
jwt.secret=${JWT_SECRET:VEhJU19JU19BX1NFQ1VSRV9CQVNFMjRfQllURV9LRVlfRk9SX0RFVl9PTkxZISE=}
jwt.expiration=86400000
